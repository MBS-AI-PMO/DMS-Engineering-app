<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The site font: Urbanist (every weight, one request) -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..900;1,400..700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..900;1,400..700&display=swap">
  </noscript>
  <!-- Prevent background flash before CSS loads -->
  <style>
    html, body { margin: 0; padding: 0; background-color: #ffffff; }
  </style>
  <!-- Title, description, social cards, canonical, icons and the admin's own
       head tags are added per page by the server (vite/headTags.js), from
       Admin > SEO & tracking, and swapped by the app on each page change. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
